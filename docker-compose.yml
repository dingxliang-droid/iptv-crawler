services:
  iptv-crawler:
    # 不再build, 直接用本机已有镜像 iptv-crawler:latest (main.py由下方挂载覆盖, 镜像内旧代码无关紧要)
    container_name: iptv-crawler
    image: iptv-crawler:latest
    volumes:
      - ./data:/data
      - ./main.py:/app/main.py    # 宿主机main.py覆盖镜像内旧文件: 以后改代码只需替换此文件并重启容器
    environment:
      - TZ=Asia/Shanghai
    restart: always

  # 把生成的 m3u 挂成网页, 供 iptv 后台/电视订阅
  m3u-server:
    image: nginx:alpine
    container_name: m3u-server
    ports:
      - "8899:80"        # 左边是群晖端口, 被占用就改成别的
    volumes:
      - ./data/output:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: always
